services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: bank_rag_backend:local
    container_name: bank_rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount the local application code to allow real-time code changes (hot-reloading)
      - ./backend/app:/app/app
      # Mount the log folder so logs are visible on the host machine
      - ./backend/logs:/app/logs
    env_file:
      - .env
    environment:
      # Override host endpoints to reference internal Docker services later
      - POSTGRES_HOST=postgres
      - CHROMA_HOST=chromadb
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: bank_rag_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
